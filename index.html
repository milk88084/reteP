<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Per-page SEO tags (title, description, canonical, Open Graph, Twitter) are
      owned by <Seo> (react-helmet-async) and baked into each public route at
      build time by scripts/prerender.mjs. Keeping them here too would duplicate
      the <meta> tags, so this static head carries only route-agnostic essentials.
      The <title> below is a pre-JS fallback; helmet replaces it in place.
    -->
    <title>reteP｜記錄每天的飲食熱量與營養</title>
    <meta name="author" content="reteP" />

    <!-- Theme -->
    <meta name="theme-color" content="#BDF2DE" />

    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="reteP" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Luckiest+Guy&family=Noto+Sans+TC:wght@400;500;700&family=Rock+Salt&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!--
      Site-wide structured data. Static (no JS needed) and the single source for
      these types — <Seo> never emits Organization / SoftwareApplication / WebSite.
      TODO(rating): add aggregateRating to SoftwareApplication once App Store
      ratingValue + ratingCount are available.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://rete-p.vercel.app/#organization",
            "name": "reteP",
            "url": "https://rete-p.vercel.app/",
            "logo": "https://rete-p.vercel.app/icons/icon-512.png",
            "email": "milk88084@gmail.com",
            "founder": { "@type": "Person", "name": "KO CHUAN LI" },
            "sameAs": ["https://apps.apple.com/tw/app/id6798490139"]
          },
          {
            "@type": "WebSite",
            "@id": "https://rete-p.vercel.app/#website",
            "name": "reteP",
            "url": "https://rete-p.vercel.app/",
            "inLanguage": "zh-Hant",
            "publisher": { "@id": "https://rete-p.vercel.app/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://rete-p.vercel.app/#app",
            "name": "reteP",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "iOS",
            "url": "https://apps.apple.com/tw/app/id6798490139",
            "inLanguage": "zh-Hant",
            "creator": { "@type": "Person", "name": "KO CHUAN LI" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="#FFC93C"/>
  <!-- Left eye white (half height = sleepy) -->
  <ellipse cx="72" cy="112" rx="28" ry="20" fill="white"/>
  <!-- Right eye white -->
  <ellipse cx="128" cy="112" rx="28" ry="20" fill="white"/>
  <!-- Eyelid cover left -->
  <rect x="44" y="92" width="56" height="20" rx="0" fill="#FFC93C"/>
  <!-- Left pupil -->
  <ellipse cx="78" cy="114" rx="10" ry="9" fill="#1E1A14"/>
  <!-- Right pupil -->
  <ellipse cx="134" cy="114" rx="10" ry="9" fill="#1E1A14"/>
  <!-- Eyelid cover right -->
  <rect x="100" y="92" width="56" height="20" fill="#FFC93C"/>
  <!-- Drowsy line left eye -->
  <path d="M44 112 Q72 96 100 112" stroke="#1E1A14" stroke-width="2.5" fill="none"/>
  <!-- Drowsy line right eye -->
  <path d="M100 112 Q128 96 156 112" stroke="#1E1A14" stroke-width="2.5" fill="none"/>
  <!-- Nose -->
  <path d="M96 135 Q100 140 104 135" stroke="#1E1A14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

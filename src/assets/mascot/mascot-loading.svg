<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="#FFC93C"/>
  <!-- Left eye white -->
  <ellipse cx="72" cy="108" rx="28" ry="33" fill="white"/>
  <!-- Right eye white -->
  <ellipse cx="128" cy="108" rx="28" ry="33" fill="white"/>
  <!-- Left pupil (shifted UP) -->
  <ellipse cx="74" cy="90" rx="13" ry="15" fill="#1E1A14"/>
  <!-- Right pupil (shifted UP) -->
  <ellipse cx="130" cy="90" rx="13" ry="15" fill="#1E1A14"/>
  <!-- Left shine -->
  <circle cx="80" cy="85" r="4" fill="white"/>
  <!-- Right shine -->
  <circle cx="136" cy="85" r="4" fill="white"/>
  <!-- Small open mouth -->
  <ellipse cx="100" cy="145" rx="10" ry="7" fill="#C49300"/>
</svg>
